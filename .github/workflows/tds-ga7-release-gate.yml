name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main
    paths:
      - 'q1/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate-test:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 23f2004545@ds.study.iitm.ac.in"
        run: |
          echo "TDS identity: 23f2004545@ds.study.iitm.ac.in"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Speeds up future workflow runs by caching dependencies

      - name: Install dependencies
        working-directory: ./q1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest # Force installs pytest in case it's missing from requirements.txt

      - name: Run release gate tests
        working-directory: ./q1
        run: python -m pytest -q # Uses python module context to completely avoid the command not found error
