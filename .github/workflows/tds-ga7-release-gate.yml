name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main
    paths:
      - 'q1/**' # Only triggers when files inside the q1 folder change

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate-test:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 23f2004545@ds.study.iitm.ac.in"
        run: echo "TDS identity: 23f2004545@ds.study.iitm.ac.in"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./q1 # Runs pip install inside the q1 directory
        run: pip install -r requirements.txt

      - name: Run release gate tests
        working-directory: ./q1 # Runs pytest inside the q1 directory
        run: pytest -q